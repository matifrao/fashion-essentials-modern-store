<!--==========================================================
    Fashion Essentials Admin V1
    Topbar Component
===========================================================-->

<header class="topbar">

    <!-- Left -->

    <div class="topbar__left">

        <!-- Mobile Menu -->

        <button
            type="button"
            class="topbar__menu-btn"
            id="sidebarToggle"
            aria-label="Toggle Sidebar">

            <i data-lucide="menu"></i>

        </button>

        <!-- Breadcrumb -->

        <div class="topbar__breadcrumb">

            <h1
                class="topbar__title"
                id="pageTitle">

                Dashboard

            </h1>

            <p
                class="topbar__subtitle"
                id="pageSubtitle">

                Welcome back.

            </p>

        </div>

    </div>


    <!-- Right -->

    <div class="topbar__right">

        <!-- Search -->

        <div class="topbar__search">

            <i data-lucide="search"></i>

            <input
                type="search"
                id="globalSearch"
                placeholder="Search...">

        </div>

        <!-- Notifications -->

        <button
            type="button"
            class="topbar__icon-btn"
            id="notificationBtn"
            aria-label="Notifications">

            <i data-lucide="bell"></i>

            <span class="topbar__badge">

                0

            </span>

        </button>

        <!-- Theme -->

        <button
            type="button"
            class="topbar__icon-btn"
            id="themeToggle"
            aria-label="Toggle Theme">

            <i data-lucide="moon"></i>

        </button>

        <!-- Profile -->

        <button
            type="button"
            class="topbar__profile"
            id="profileMenu">

            <div class="topbar__avatar">

                FE

            </div>

            <div class="topbar__user">

                <strong>

                    Administrator

                </strong>

                <small>

                    Super Admin

                </small>

            </div>

            <i data-lucide="chevron-down"></i>

        </button>

    </div>

</header>
