<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products | Fashion Essentials Admin V1</title>

    <meta name="description"
          content="Manage Products">

    <link rel="stylesheet"
          href="css/main.css">

</head>

<body data-page="products">

    <!--==========================================
        Admin Layout
    ==========================================-->

    <div class="admin-layout">

        <!-- Sidebar -->

        <div id="sidebar"></div>

        <!--======================================
            Main Content
        ======================================-->

        <div class="dashboard__main">

            <!-- Topbar -->

            <div id="topbar"></div>

            <!--==================================
                Content
            ==================================-->

            <main class="content">

                <section class="products">

                    <!--==================================
                        Page Header
                    ==================================-->

                    <header class="products__header">

                        <div class="products__header-left">

                            <h1 class="products__title">

                                Products

                            </h1>

                            <p class="products__subtitle">

                                Manage your Fashion Essentials catalogue.

                            </p>

                        </div>

                        <div class="products__actions">

                            <button
                                type="button"
                                class="btn btn-outline"
                                id="refreshProductsBtn">

                                Refresh

                            </button>

                            <button
                                type="button"
                                class="btn btn-outline"
                                id="exportProductsBtn">

                                Export

                            </button>

                            <button
                                type="button"
                                class="btn btn-primary"
                                id="addProductBtn">

                                + Add Product

                            </button>

                        </div>

                    </header>

                    <!--==================================
                        Bulk Actions
                    ==================================-->

                    <section
                        class="products__bulk"
                        id="bulkActions"
                        hidden>

                        <div class="products__bulk-info">

                            <strong id="selectedCount">

                                0

                            </strong>

                            <span>

                                product(s) selected

                            </span>

                        </div>

                        <div class="products__bulk-actions">

                            <button
                                type="button"
                                class="btn btn-outline"
                                id="bulkActiveBtn">

                                Mark Active

                            </button>

                            <button
                                type="button"
                                class="btn btn-outline"
                                id="bulkDraftBtn">

                                Mark Draft

                            </button>

                            <button
                                type="button"
                                class="btn btn-danger"
                                id="bulkDeleteBtn">

                                Delete Selected

                            </button>

                        </div>

                    </section>

                    <!--==================================
                        Filters
                    ==================================-->

                    <section class="products__filters">

                        <div class="products__search">

                            <input
                                type="search"
                                id="searchProduct"
                                placeholder="Search by product name, SKU or barcode...">

                        </div>

                        <select id="filterStatus">

                            <option value="">

                                All Status

                            </option>

                            <option value="Active">

                                Active

                            </option>

                            <option value="Draft">

                                Draft

                            </option>

                            <option value="Archived">

                                Archived

                            </option>

                        </select>

                        <select id="filterCategory">

                            <option value="">

                                All Categories

                            </option>

                        </select>

                        <select id="filterBrand">

                            <option value="">

                                All Brands

                            </option>

                        </select>

                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="resetFiltersBtn">

                            Reset Filters

                        </button>

                    </section>

                              <!--==================================
                        Products Table
                    ==================================-->

                    <section class="products__table">

                        <div class="table-responsive">

                            <table class="table">

                                <thead>

                                    <tr>

                                        <th width="50">

                                            <input
                                                type="checkbox"
                                                id="selectAll">

                                        </th>

                                        <th width="80">

                                            Image

                                        </th>

                                        <th
                                            class="sortable"
                                            data-sort="name">

                                            Product

                                        </th>

                                        <th
                                            class="sortable"
                                            data-sort="category">

                                            Category

                                        </th>

                                        <th
                                            class="sortable"
                                            data-sort="price">

                                            Price

                                        </th>

                                        <th
                                            class="sortable"
                                            data-sort="stock">

                                            Stock

                                        </th>

                                        <th
                                            class="sortable"
                                            data-sort="status">

                                            Status

                                        </th>

                                        <th width="160">

                                            Actions

                                        </th>

                                    </tr>

                                </thead>

                                <tbody id="productsTable">

                                    <tr>

                                        <td
                                            colspan="8">

                                            <div class="products-empty">

                                                <h3>

                                                    No Products Found

                                                </h3>

                                                <p>

                                                    Click <strong>Add Product</strong> to create your first product.

                                                </p>

                                            </div>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </section>

                    <!--==================================
                        Footer
                    ==================================-->

                    <section class="products__footer">

                        <div class="products__footer-left">

                            <span id="tableInfo">

                                Showing 0 of 0 products

                            </span>

                        </div>

                        <div class="products__footer-right">

                            <label for="pageSize">

                                Rows

                            </label>

                            <select id="pageSize">

                                <option value="10">

                                    10

                                </option>

                                <option value="25">

                                    25

                                </option>

                                <option value="50">

                                    50

                                </option>

                                <option value="100">

                                    100

                                </option>

                            </select>

                        </div>

                    </section>

                    <!--==================================
                        Pagination
                    ==================================-->

                    <nav
                        class="pagination"
                        id="pagination">

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="firstPage">

                            First

                        </button>

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="prevPage">

                            Previous

                        </button>

                        <div
                            class="pagination__pages"
                            id="pageNumbers">

                        </div>

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="nextPage">

                            Next

                        </button>

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="lastPage">

                            Last

                        </button>

                    </nav>

                </section>

            </main>

        </div>

    </div>

    <!--==========================================
        Scripts
    ==========================================-->

    <script
        type="module"
        src="js/components/sidebar.js"></script>

    <script
        type="module"
        src="js/components/topbar.js"></script>

    <script
        type="module"
        src="js/pages/products/index.js"></script>

</body>

</html>
