<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Fashion Essentials Admin V1</title>

    <meta name="description"
          content="Fashion Essentials Admin Dashboard">

    <link rel="stylesheet"
          href="css/main.css">

</head>

<body data-page="dashboard">

    <!--==========================================
        Admin Layout
    ===========================================-->

    <div class="admin-layout">

        <!-- Sidebar Component -->

        <div id="sidebar"></div>

        <!--======================================
            Main Area
        ======================================-->

        <div class="dashboard__main">

            <!-- Topbar Component -->

            <div id="topbar"></div>

            <!--==================================
                Content
            ==================================-->

            <main class="content">

                <!-- Welcome -->

                <section class="dashboard__welcome">

                    <h2>

                        Welcome Back 👋

                    </h2>

                    <p>

                        Manage your Fashion Essentials store from one place.

                    </p>

                </section>

                <!-- Statistics -->

                <section class="stats-grid">

                    <article class="card">

                        <h3>Total Products</h3>

                        <span id="totalProducts">

                            0

                        </span>

                    </article>

                    <article class="card">

                        <h3>Total Orders</h3>

                        <span id="totalOrders">

                            0

                        </span>

                    </article>

                    <article class="card">

                        <h3>Customers</h3>

                        <span id="totalCustomers">

                            0

                        </span>

                    </article>

                    <article class="card">

                        <h3>Revenue</h3>

                        <span id="totalRevenue">

                            Rs. 0

                        </span>

                    </article>

                </section>

                <!-- Recent Orders -->

                <section class="dashboard__section">

                    <div class="section__header">

                        <h2>

                            Recent Orders

                        </h2>

                    </div>

                    <div class="card">

                        <p>

                            Recent orders will appear here.

                        </p>

                    </div>

                </section>

                <!-- Low Stock -->

                <section class="dashboard__section">

                    <div class="section__header">

                        <h2>

                            Low Stock Products

                        </h2>

                    </div>

                    <div class="card">

                        <p>

                            Low stock alerts will appear here.

                        </p>

                    </div>

                </section>

            </main>

            <!-- Footer -->

            <footer class="footer">

                <p>

                    © 2026 Fashion Essentials. All Rights Reserved.

                </p>

            </footer>

        </div>

    </div>

    <!--==========================================
        Scripts
    ===========================================-->

    <script type="module"
            src="js/components/sidebar.js"></script>

    <script type="module"
            src="js/components/topbar.js"></script>

    <script type="module"
            src="js/pages/dashboard.js"></script>

</body>

</html>
