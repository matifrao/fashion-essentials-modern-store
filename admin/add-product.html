<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | Fashion Essentials Admin</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-layout">
        <aside id="sidebar"></aside>

        <div class="admin-main">
            <header id="topbar"></header>

            <main class="dashboard">
                <section class="page-header">
                    <div>
                        <h1 id="form-title">Add Product</h1>
                        <p>Create or update products shown on shop.html.</p>
                    </div>

                    <a class="admin-button secondary" href="products.html">Back to Products</a>
                </section>

                <form class="admin-form" id="product-form">
                    <input id="product-id" type="hidden">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="product-name">Product Name</label>
                            <input id="product-name" required>
                        </div>

                        <div class="form-group">
                            <label for="product-category">Category</label>
                            <input id="product-category" placeholder="Caps, Hijab, Abaya">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="product-price">Price</label>
                            <input id="product-price" placeholder="PKR 499" required>
                        </div>

                        <div class="form-group">
                            <label for="product-stock">Stock</label>
                            <input id="product-stock" type="number" min="0" value="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="product-status">Status</label>
                        <select id="product-status">
                            <option>Active</option>
                            <option>Draft</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="product-image">Main Image Path</label>
                        <input id="product-image" placeholder="images/products/cat1/p1.jpeg" required>
                    </div>

                    <div class="form-group">
                        <label for="product-images">Other Images</label>
                        <textarea id="product-images" placeholder="images/products/cat1/p1.jpeg, images/products/cat1/p2.jpeg"></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="product-colors">Colors</label>
                            <input id="product-colors" placeholder="black, cream, beige">
                        </div>

                        <div class="form-group">
                            <label for="product-sizes">Sizes</label>
                            <input id="product-sizes" placeholder="S, M, L, Free Size">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="product-related">Linked / Related Products</label>
                        <input id="product-related" placeholder="Premium Hijab Tube Caps, 4-in-One Hijab Caps">
                    </div>

                    <div class="form-actions">
                        <button class="admin-button" type="submit">Save Product</button>
                        <a class="admin-button secondary" href="products.html">Cancel</a>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="../js/products-data.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/admin-products.js"></script>
</body>
